<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Ejercicio 2 - Alertas</title>
</head>
<body>
  <div class="tarjetas">
    <div class="tarjeta-exito">
          <p class="title">EXITO</p>
          <p class="msg">Ha accedido al sistema correctamente.</p>
    </div>
    <div class="tarjeta-error">
          <p class="title">ERROR</p>
          <p class="msg">Las credenciales son incorrectas.</p>
    </div>
    <div class="tarjeta-info">
          <p class="title">INFORMACION</p>
          <p class="msg">Recuerde introducir las credenciales y aceptar los términos.</p>
    </div>
  </div>
</body>
</html>
